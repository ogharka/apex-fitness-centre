name: Deploy blog comments

# Sets up and updates the blog comment service on Cloudflare (free plan).
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   - Cloudflare API token with "Workers Scripts: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account ID
#   COMMENTS_ADMIN_KEY     - a password you choose, used on the /admin moderation page
# Run it from the Actions tab (Run workflow). It also runs when source/comments/ changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["source/comments/**", ".github/workflows/deploy-comments.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-comments
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_KEY: ${{ secrets.COMMENTS_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check secrets
        id: check
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_KEY; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::Missing secrets:$missing. Add them under Settings > Secrets and variables > Actions."; exit 1; fi
            echo "::notice::Comments not set up yet (missing secrets:$missing). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Wrangler
        if: steps.check.outputs.skip != 'true'
        run: npm install --no-save wrangler@4
      - name: Create the database if needed
        if: steps.check.outputs.skip != 'true'
        working-directory: source/comments
        run: |
          W=../../node_modules/.bin/wrangler
          ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const x=l.find(d=>d.name==="apex-comments");process.stdout.write(x?x.uuid:"")})')
          if [ -z "$ID" ]; then
            $W d1 create apex-comments
            ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);process.stdout.write(l.find(d=>d.name==="apex-comments").uuid)})')
          fi
          echo "Database: $ID"
          sed -i "s/REPLACED_BY_WORKFLOW/$ID/" wrangler.toml
          $W d1 execute apex-comments --remote --file schema.sql
      - name: Deploy the worker
        if: steps.check.outputs.skip != 'true'
        working-directory: source/comments
        run: |
          W=../../node_modules/.bin/wrangler
          $W deploy
          printf '%s' "$ADMIN_KEY" | $W secret put ADMIN_KEY
      - name: Save the comments address for the website build
        if: steps.check.outputs.skip != 'true'
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write((j.result&&j.result.subdomain)||"")})')
          if [ -z "$SUB" ]; then echo "::error::No workers.dev subdomain. Open Workers & Pages in the Cloudflare dashboard once to choose one, then run this again."; exit 1; fi
          URL="https://apex-comments.$SUB.workers.dev"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/" || true)
          echo "::notice::Comments service $URL (admin page $URL/admin) answered HTTP $code"
          echo "$URL" > source/comments-endpoint.txt
          git checkout -- source/comments/wrangler.toml
          if ! git diff --quiet -- source/comments-endpoint.txt || [ -n "$(git ls-files --others --exclude-standard source/comments-endpoint.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add source/comments-endpoint.txt
            git commit -m "Turn on blog comments ($URL)"
            echo "::notice::Changed files before push: $(git status --porcelain | tr '\n' ' ')"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done || { echo "::error::Could not push the comments address"; exit 1; }
          else
            echo "Comments address unchanged."
          fi
      - name: Rebuild the website with comments switched on
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
